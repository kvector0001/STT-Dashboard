name: News Refresh (news only)

on:
  # Weekend news scans, triggered by cron-job.org. No prices, no Telegram.
  # Weekdays the news scan already runs inside "Refresh Stock Prices".
  workflow_dispatch:
    inputs:
      alert:
        description: 'Ignored (lets a cloned movers cron job call this too)'
        type: boolean
        default: false

# Shares the refresh lock so this and the price refresh never push news.json at the same time.
concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pypdf

      - name: Scan filings + news, summarise new key filings
        run: |
          python scripts/news_digest.py --fill-new
          python scripts/news_digest.py --days 3 --json
          python scripts/news_digest.py --summarize 3

      - name: Commit and push news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "No new news."
          else
            git commit -m "chore: news refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
