name: Refresh Stock Prices

on:
  # Scheduling is done by cron-job.org (GitHub's own cron ran 5-6h late / mostly dropped).
  workflow_dispatch:            # Manual trigger from GitHub Actions tab / cron-job.org
    inputs:
      alert:
        description: 'Send daily movers to Telegram'
        type: boolean
        default: false
  repository_dispatch:          # Trigger from browser Refresh button
    types: [refresh-prices]

# One refresh at a time — overlapping runs were racing each other on git push.
concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas openpyxl gspread google-auth

      - name: Fetch prices
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas openpyxl requests gspread google-auth
          python scripts/fetch_prices.py

      - name: Send daily movers to Telegram
        if: github.event_name == 'workflow_dispatch' && inputs.alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_alert.py

      - name: Fetch extended data
        run: python scripts/fetch_extended_data.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json stocks.json data/portfolio.xlsx
          if [ -f action_log.json ]; then git add action_log.json; fi
          # Always commit — even empty — so GitHub sees repo activity and keeps cron alive
          if git diff --staged --quiet; then
            git commit --allow-empty -m "chore: keepalive $(date -u +'%Y-%m-%d %H:%M UTC')"
          else
            git commit -m "chore: refresh prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi
          git push
